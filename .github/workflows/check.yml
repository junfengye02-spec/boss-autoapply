name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 skills/boss-apply/scripts/test_runner.py
      - run: python3 skills/boss-apply/scripts/doctor.py
      - run: node --check skills/boss-apply/scripts/goodJobs.user.js
